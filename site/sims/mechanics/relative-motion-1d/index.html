<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Շարժման հարաբերականություն · Ֆիզիկայի Լաբորատորիաներ</title>
  <link rel="icon" href="../../../assets/img/favicon.svg" type="image/svg+xml">
  <script src="../../../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../../../assets/css/main.css">
  <script defer src="bundle.js"></script>
</head>
<body data-sim="relative-motion-1d" data-section="mechanics">
  <header data-shell="header"></header>

  <main class="page">
    <header class="sim-head">
      <h1 class="sim-title">Շարժման հարաբերականություն</h1>
    </header>

    <div class="sim-layout">
      <section class="stage">
        <div class="canvas-wrap">
          <canvas id="cv" aria-label="Շարժման հարաբերականություն"></canvas>
        </div>

        <div class="readouts">
          <div class="readout">
            <div class="readout__title"><i class="swatch" style="--c:#c14a3a"></i>Կարմիր զատիկ</div>
            <div id="r1"></div>
          </div>
          <div class="readout">
            <div class="readout__title"><i class="swatch" style="--c:#2b6bb0"></i>Կապույտ զատիկ</div>
            <div id="r2"></div>
          </div>
          <div class="readout">
            <div class="readout__title"><i class="swatch swatch--square" style="--c:#3a3a3a"></i>Ժապավեն</div>
            <div id="rb"></div>
          </div>
        </div>
      </section>

      <aside class="panel">
        <section class="group">
          <h2 class="group__title">Կառավարում</h2>
          <div class="btn-row">
            <button class="btn btn--primary" id="playBtn">▶ Սկսել</button>
            <button class="btn" id="resetBtn">↺ Վերագործարկել</button>
          </div>
          <label class="check"><input type="checkbox" id="vectorsToggle" checked> Ցույց տալ արագության վեկտորները</label>
        </section>

        <section class="group">
          <h2 class="group__title"><i class="swatch swatch--square" style="--c:#3a3a3a"></i>Ժապավենի արագություն</h2>
          <div class="field">
            <label class="field__label" for="belt-vx">V<sub>ժապ․</sub></label>
            <output class="field__value" for="belt-vx"></output>
            <input type="range" id="belt-vx" min="-100" max="100" value="20" step="1">
          </div>
        </section>

        <section class="group">
          <h2 class="group__title"><i class="swatch" style="--c:#c14a3a"></i>Կարմիր զատիկ</h2>
          <div class="field">
            <span class="field__label">Մակերևույթ</span>
            <div class="segmented tint" style="--accent: #e0675a" id="lb1-surface" role="group" aria-label="Մակերևույթ">
              <button data-value="ground" aria-pressed="true">Գետին</button>
              <button data-value="belt">Ժապավեն</button>
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="lb1-x0">Սկզբն. X<sub>0</sub></label>
            <output class="field__value" for="lb1-x0"></output>
            <input type="range" id="lb1-x0" min="-100" max="800" value="0" step="1">
          </div>
          <div class="field">
            <label class="field__label" for="lb1-vx">Արագ. V<sub>0</sub></label>
            <output class="field__value" for="lb1-vx"></output>
            <input type="range" id="lb1-vx" min="-100" max="100" value="70" step="1">
          </div>
        </section>

        <section class="group">
          <h2 class="group__title"><i class="swatch" style="--c:#2b6bb0"></i>Կապույտ զատիկ</h2>
          <div class="field">
            <span class="field__label">Մակերևույթ</span>
            <div class="segmented tint" style="--accent: #4a8fdb" id="lb2-surface" role="group" aria-label="Մակերևույթ">
              <button data-value="ground">Գետին</button>
              <button data-value="belt" aria-pressed="true">Ժապավեն</button>
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="lb2-x0">Սկզբն. X<sub>0</sub></label>
            <output class="field__value" for="lb2-x0"></output>
            <input type="range" id="lb2-x0" min="-100" max="800" value="0" step="1">
          </div>
          <div class="field">
            <label class="field__label" for="lb2-vx">Արագ. V<sub>0</sub></label>
            <output class="field__value" for="lb2-vx"></output>
            <input type="range" id="lb2-vx" min="-100" max="100" value="50" step="1">
          </div>
        </section>
      </aside>
    </div>
  </main>

  <footer data-shell="footer"></footer>
</body>
</html>
